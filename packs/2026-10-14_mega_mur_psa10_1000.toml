# MEGA MUR PSA10ガチャ（1,000円課金・5,000口）
#
# Backlog PJ_KJ_META_ORIPA-22（週次MTG 2026/10/14「2-2. ガチャ構築 > 企画案」、担当 槌田、期限 10/20）:
#   一口1,000円課金、トップ30〜40万円、総口5,000口程度、還元率105〜110%。
#
# テーマ: MEGAシリーズの最上位レア MUR を中心に、当たりは全部PSA10。
#   - 課金ガチャなので還元率は100%超。105%にすると、配送のみ利益でほぼ収支トントン〜少し黒字。
#   - 過去の1,000円課金（シート27: 1,000×5,600口・100.9%・S爆3枚）を参考にした。
#   - メガレックウザex MUR は征悟さんの「10000 100%以下」、メガ系SAR（レックウザ・カイリュー・ラティアス・ゲンガー）は
#     ドラゴン／ハロウィンで使っているので入れていない。
#   - 競合: 大手でMUR縛りは見つからず。カーナベルの「オリパの日」（10/10）にMUR3種の限定オリパがあった
#     （docs/competitors/競合チェック記録.md）。
#
# PSA10の値段は相場サイト（ポケカチ）とカードラッシュ（10/14検索）。MURは値下がりが続いていて、
# サイトによって差が大きい。仕入れ前にスニダンで確認して再実行すること。

