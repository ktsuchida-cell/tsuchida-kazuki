# 100PT BOXガチャ（一回100PT・30,000口）
#
# Backlog PJ_KJ_META_ORIPA-21（週次MTG 2026/10/14「2-2. ガチャ構築 > 企画案」、担当 槌田、期限 10/20）:
#   一口100pt以下、BOXガチャ or トップ10万円以下、総口30,000口程度、還元率97%。
#
# 形: 未開封BOXだけのBOXガチャ。トップは25th ANNIVERSARY COLLECTION（約7.7万円）で10万円以下。
#   - 30,000口に30箱 → BOXの当たり 1/1,000。競合の100円オリパは10万〜20万口で当たり0.01〜0.02%が多い
#     （docs/competitors/競合チェック記録.md 2026-10-14）。口数が少ないぶんBOXが当たりやすい。
#   - ハズレ枠は2倍アド（200PT）と最低保証（30PT）。
#   - 過去のBOXガチャ（【済】BOXガチャ 55PT×80,000口 96.4%、1/319 box 50PT×63,800口 102.9%）を参考にした。
#
# BOXの値段は 2026-10-14 時点の取引相場（PRICE BASE・ポケカBOX研究所）と、構築シートの過去の値。
# シュリンクの有無で値段が大きく変わるので、仕入れ前にスニダンで確認して再実行すること。

[pack]
name = "100PT BOXガチャ"
author = "槌田（案）"
price = 100
draws = 30000
target_return_rate = 0.97
