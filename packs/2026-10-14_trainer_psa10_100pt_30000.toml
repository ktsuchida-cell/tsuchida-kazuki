#   当たりは30枚すべてPSA10。トップはナンジャモ SAR PSA10（約9万円）。
#   - 過去の「サポ爆祭り（お詫びガチャ）」はSM期のトレーナーSR。今回はSV期のSARと相棒ポケモンで組んだ。
#   - ヒビキのホウオウex SAR は征悟さんの「10000課金 110%」、マツバの確信 SAR はハロウィンで使っているので入れていない。
#
# PSA10の値段は 2026-10-14 時点のカードラッシュ販売価格と相場サイト（ポケカチ）。仕入れ前にスニダンで確認して再実行すること。

