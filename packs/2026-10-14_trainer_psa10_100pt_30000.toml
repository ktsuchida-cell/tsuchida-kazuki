# トレーナー＆相棒 PSA10ガチャ（一回100PT・30,000口）
#
# Backlog PJ_KJ_META_ORIPA-21（週次MTG 2026/10/14「2-2. ガチャ構築 > 企画案」、担当 槌田、期限 10/20）:
#   一口100pt以下、BOXガチャ or トップ10万円以下、総口30,000口程度、還元率97%。
#   → 当たりはPSA10が必須なので（未開封BOXは鑑定できない）、「トップ10万円以下」で組んだ。
#     最初に作ったBOXガチャ版（2026-10-14_box_100pt_30000.toml）は不採用。
