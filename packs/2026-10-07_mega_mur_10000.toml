# 1万円課金ガチャ「MEGA MURコレクション」（構築シート「シート35」の枠で作成）
#
# テーマ: MEGAシリーズの最上位レア MUR（メガウルトラレア）＋メガ系SAR。
#   - メタオリパでは未実施（過去はメガ系カードが単発で入った程度）。
#   - 競合の1万円帯は PSA10確定・BOX確定・セット賞が中心で、MUR/メガ縛りは検索では見つからなかった。
#   - 競合で人気の PSA10 を S爆に2枚入れている。
#
# 仕入れ価格はウェブ検索で拾った販売相場（2026/7/22〜10/6、日付はメモ欄）。
# 相場が下落中なので、仕入れ前に必ずスニダンで確認して cost を更新し、再実行すること。

