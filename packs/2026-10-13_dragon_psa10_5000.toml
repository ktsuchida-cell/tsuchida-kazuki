# ドラゴン PSA10ガチャ（一回5,000PT）
#
# 征悟さんの依頼（2026-10-12 #メタオリパ_社内連携チャット）:
#   一回5,000PT、総口2,000〜5,000口、トップ20〜40万円。
#
# テーマ: ドラゴンタイプのポケモン縛り・当たりは全部PSA10。
#   - 構築シートの過去パックにドラゴン縛りはない。検索した範囲では競合にも見つからなかった。
#     ただしレックウザ中心のガチャは競合にある（ポケットクロス「レックウザどか盛り」など、2026-10-14確認）。
#   - ギラティナV SA はハロウィン（PSA10）の目玉なので入れていない。
#   - 一回5,000PT以上の過去パック（シート9・アド確課金・1/10 高還元）はどれも還元率100%超で赤字。
#     このパックは還元率97%に収める。
#
# 仕入れ価格は 2026-10-13 に販売店のPSA10価格（主にカードラッシュ）で調べ直した。
# 仕入れ前にスニダンでも確認して再実行すること。
#
# 当選番号は高いカードほど後ろ（トップは総口の9割以降）。ツールが自動でそうする。

