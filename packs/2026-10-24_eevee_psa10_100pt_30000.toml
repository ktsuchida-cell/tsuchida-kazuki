# ブイズ PSA10ガチャ（一回100PT・30,000口）
#
# 2026-10-24 槌田さんの依頼（ORIPA-21 と同じ条件で、新しいパックを作る）:
#   一口100pt以下、BOXガチャ or トップ10万円以下、総口30,000口程度、還元率97%。
#   → 当たりはPSA10が必須なので「トップ10万円以下」で組んだ。
#
# テーマ: イーブイと進化形（ブイズ）。当たりは29枚すべてPSA10。
#   - 目玉はブラッキーex SAR PSA10（テラスタルフェスex）。テラスタルフェスexのブイズSARは全種入れた。
#   - 競合: ブイズのオリパは大手（DOPA!・クローブ・日本トレカセンター・オリパワン）で多く出ているが、
#     「1口100PT・3万口・当たり全部PSA10」のものは見つからなかった（docs/competitors/競合チェック記録.md）。
#   - 過去の構築シートのブイズ系（1/2・シート10・（オープン）課金ガチャ）は一回1,000〜10,000PTのブラッキーVMAX中心で、どれも終了。
#   - グレイシアV SA・ニンフィアV SA は公開中のパック（復刻のリザードン・ミュウツー＆ミュウ10000課金）に入っているので、
#     S爆はエーフィV SA・ブースターV SA にした（2026-10-24 槌田さん確認）。
#
# PSA10の値段は 2026-10-24 時点のカードラッシュ販売価格（売切のものは店の設定価格）と magi の成約価格。
# ブラッキーex SAR PSA10 は過去12か月で3.5万〜12.2万円と値動きが大きい。10万円を超えたら目玉を見直す。
# 仕入れ前にスニダンで確認して再実行すること。

[pack]
name = "ブイズ PSA10ガチャ"
author = "槌田（案）"
price = 100
draws = 30000
target_return_rate = 0.97
max_return_rate = 1.00
seed = 20261024

