# 初代151 PSA10ガチャ（1,000円課金・5,000口）
#
# 2026-10-24 槌田さんの依頼（ORIPA-22 と同じ条件で、新しいパックを作る）:
#   一口1,000円課金、トップ賞30〜40万円、総口5,000口程度、還元率105〜110%。
#
# テーマ: 初代（カントー）のポケモンとトレーナー。当たりは12枚すべてPSA10。
#   - 目玉はリザードンGX SSR PSA10（約35万円）。「ポケモンカード151」の中にはPSA10で30万円を超えるカードがないので、
#     目玉とS爆は別の弾の初代ポケモンにした。S賞は151のSAR・マスターボールミラーが中心。
#   - メガリザードンXex MUR は MEGA MUR PSA10ガチャ（ORIPA-22）の目玉なので入れていない。
#   - 課金ガチャなので還元率は100%超。105%にすると、配送のみ利益で黒字に収まる。
#
# PSA10の値段は 2026-10-24 時点のカードラッシュ販売価格（売切のものは店の設定価格）と magi の成約価格のうち高い方。
# 151のPSA10はカードラッシュでほぼ売切なので、仕入れは magi や他店になる。仕入れ前にスニダンで確認して再実行すること。

[pack]
name = "初代151 PSA10ガチャ（1,000円課金）"
author = "槌田（案）"
price = 1000
draws = 5000
target_return_rate = 1.05
max_return_rate = 1.10
seed = 20261025

