# X（@metaoripa_）の投稿ルール。
# 投稿の分析（python -m oripa.sns analyze）・たたき台作り（draft）・チェック（check）がこのファイルを使う。
#
# 2026-10-28 時点は、実際の投稿を読む前の「仮」のルール。
# 投稿データ（sns/posts/）を入れて分析したら、種類・キーワード・ハッシュタグを実際の投稿に合わせて直すこと。

[account]
handle = "@metaoripa_"
url = "https://metaoripa.com/"

[post]
max_length = 280      # X の数え方（日本語・絵文字は2、URLは23）。無料アカウントの上限。Premium でも280を超えると「さらに表示」で折りたたまれる
max_hashtags = 3      # これより多いと注意を出す
hashtags = ["#メタオリパ", "#オリパ", "#ポケカ"]   # 仮。分析で実際に使っているタグに合わせる
templates = "templates"

# ---- 投稿の種類 ----
# 本文にキーワードが一番多く入っている種類に分ける（同点なら上に書いた方）。どれにも当たらなければ「その他」。
[[types]]
name = "新ガチャ告知"
purpose = "新しいガチャの公開を知らせて、サイトに来てもらう"
keywords = ["新ガチャ", "新オリパ", "新作", "公開", "販売開始", "発売", "NEW", "登場", "スタート"]

[[types]]
name = "当選報告"
purpose = "当たりが出たことを見せて、当たりが本当に入っていると伝える"
keywords = ["当選おめでとう", "おめでとうございます", "㊗", "排出", "当たり報告", "引かれ", "神引き", "GET", "ゲット"]

[[types]]
name = "残り口数"
purpose = "販売中のガチャの残りと、残っている当たりを知らせる"
keywords = ["残り", "ラスト", "完売", "売り切れ", "SOLD", "終了間近", "ラストワン"]

[[types]]
name = "プレゼント企画"
purpose = "フォロー・リポストでフォロワーを増やす"
keywords = ["プレゼント", "フォロー", "リポスト", "RP", "抽選", "応募", "締切", "キャンペーン"]

[[types]]
name = "お知らせ"
purpose = "メンテナンス・不具合・発送などの連絡"
keywords = ["お知らせ", "メンテナンス", "メンテ", "障害", "不具合", "お詫び", "復旧", "重要", "発送"]

# ---- 使わない言葉（check でエラー） ----
# 社内のチェック用。法的な判断が必要なものは担当者・専門家に確認する。
[[ng]]
words = ["換金", "現金化", "現金に"]
reason = "カードやポイントをお金に替えられると受け取られる表現は使わない（賭博と見られるおそれ）"

[[ng]]
words = ["儲かる", "儲け", "稼げる", "稼ご", "投資"]
reason = "お金が増えると誤解させる表現は使わない（有利誤認のおそれ）"

[[ng]]
words = ["必ず当たる", "絶対当たる", "絶対に当たる", "損しない", "損はさせない", "ノーリスク", "元が取れる"]
reason = "結果を保証する表現は使わない（有利誤認のおそれ）"

# ---- 使うときに確かめる言葉（check で注意） ----
[[caution]]
words = ["確定"]
reason = "「PSA10確定」など事実のときだけ使う。何が確定かを書く"

[[caution]]
words = ["残りわずか", "残り僅か", "ラストチャンス", "売り切れ間近", "急げ"]
reason = "実際の残り口数と合わせて書く（draft --remaining）。あおりすぎない"

[[caution]]
words = ["今だけ", "期間限定", "本日限り", "本日限定"]
reason = "いつまでかを書く"

[[caution]]
words = ["No.1", "NO.1", "ナンバーワン", "業界最高", "業界初", "日本一", "最安", "最高還元"]
reason = "根拠がなければ使わない（優良誤認・有利誤認のおそれ）。使うなら根拠を書く"

[[caution]]
words = ["高還元"]
reason = "還元率の数字とセットで書く。実際の還元率より高く見せない"

[[caution]]
words = ["プレゼント"]
reason = "購入を条件にする企画は景品の上限がある（景品表示法）。条件・人数・締切・当選連絡の方法を書く"

[[caution]]
words = ["無料"]
reason = "条件があれば書く（会員登録が必要・初回だけ など）"
